version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: sale_price
        tests: [not_null]
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
  - name: stg_users
    columns:
      - name: user_id
        tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
